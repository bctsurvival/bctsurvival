# Po každé změně (i z administrace) sestaví web a nasadí ho na GitHub Pages.
name: Sestavení webu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # datum poslední změny zápisu pro sitemap
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow==11.3.0 pillow-heif==1.1.0
      - run: php --version
      - run: python3 build/build.py
        env:
          SITE_URL: https://bctsurvival.cz
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
